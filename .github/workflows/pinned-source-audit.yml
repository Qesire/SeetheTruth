name: Pinned Real-Source Operator Audit
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  upstream-source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify static-only local regression suite
        run: python -m unittest discover -s tests -p 'test_operator_integrity.py' -v
      - name: Compare operator sites to official pinned GPT-2 code
        env:
          SEETHTRUTH_AUDIT_UPSTREAM: '1'
        run: python -m unittest discover -s tests -p 'test_pinned_gpt2_source.py' -v
