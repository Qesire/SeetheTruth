name: Pinned TinyStories CPU Real-Model Capture
on:
  pull_request:
    paths:
      - 'model_trace.js'
      - 'scripts/capture_model_trace.py'
      - 'real_model_lab.html'
      - 'tests/model_trace_contracts.js'
      - 'tests/verify_real_model_replay.py'
      - 'tests/browser_real_model_lab.py'
      - '.github/workflows/pinned-tiny-model-capture.yml'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/capture_model_trace.py'
      - '.github/workflows/pinned-tiny-model-capture.yml'
permissions:
  contents: read
concurrency:
  group: tinystories-model-capture-${{ github.ref }}
  cancel-in-progress: true
jobs:
  real-small-model-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install CPU-only PyTorch and fixed model libraries
        run: |
          python -m pip install --disable-pip-version-check 'torch==2.6.0+cpu' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check 'transformers==4.44.2' 'numpy>=1.26,<2' 'huggingface_hub>=0.23,<1'
      - name: Resolve and pin immutable upstream model revision
        id: revision
        shell: bash
        run: |
          python - <<'PY'
          import os,re
          from huggingface_hub import HfApi
          sha=HfApi().model_info("roneneldan/TinyStories-1M").sha
          if not re.fullmatch(r"[0-9a-f]{40}",sha):
              raise RuntimeError("Model revision is not an immutable SHA")
          with open(os.environ["GITHUB_OUTPUT"],"a") as out:
              out.write("sha="+sha+"\n")
          print("Resolved pinned TinyStories-1M model revision:",sha)
          PY
      - name: Execute real pretrained small-model forward and backward
        run: |
          python scripts/capture_model_trace.py --model roneneldan/TinyStories-1M --revision "${{ steps.revision.outputs.sha }}" --max-tokens 16 --max-elements 64 --out artifacts/real-model/tinystories-1m-real-trace.json
      - name: Repeat CPU forward/backward in a fresh Python process
        run: |
          python scripts/capture_model_trace.py --model roneneldan/TinyStories-1M --revision "${{ steps.revision.outputs.sha }}" --max-tokens 16 --max-elements 64 --out artifacts/real-model/tinystories-1m-independent-replay.json
          python tests/verify_real_model_replay.py artifacts/real-model/tinystories-1m-real-trace.json artifacts/real-model/tinystories-1m-independent-replay.json --manifest artifacts/real-model/replay-proof.json
      - name: Validate captured file without changing its evidence tier
        run: |
          node tests/model_trace_contracts.js
          node -e 'const fs=require("fs"),T=require("./model_trace.js");const x=JSON.parse(fs.readFileSync("artifacts/real-model/tinystories-1m-real-trace.json","utf8"));const y=T.validate(x);if(y.status!=="provenance_claim_structurally_valid_not_independently_verified")throw Error("unexpected tier");console.log("REAL_MODEL_CPU_CAPTURE_ARTIFACT_VALID:",y.source,y.module,"loss",y.loss)'
      - name: Render real sampled model tensors in genuine Chromium
        run: |
          python -m pip install --disable-pip-version-check 'playwright==1.55.0'
          python -m playwright install --with-deps chromium
          SEETHTRUTH_REAL_MODEL_CAPTURE=artifacts/real-model/tinystories-1m-real-trace.json python tests/browser_real_model_lab.py
      - name: Archive real observed tensor screenshots (not a concept mockup)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pinned-tinystories-1m-real-model-browser-evidence
          path: |
            real_model_screenshots/*.png
            real_model_screenshots/manifest.json
          if-no-files-found: warn
          retention-days: 14
      - name: Archive actual small-model trace for independent replay
        uses: actions/upload-artifact@v4
        with:
          name: pinned-tinystories-1m-real-model-cpu-evidence
          path: artifacts/real-model/*.json
          retention-days: 14
