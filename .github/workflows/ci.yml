name: Static Analysis CI
on:
  push:
  pull_request:
jobs:
  evidence-contract:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Python syntax and tests
        run: |
          python -m py_compile atlas_parser.py atlas_server.py runtime_trace.py examples/runtime_trace_demo.py
          python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Tensor graph JavaScript syntax
        run: |
          node --check tensor_subgraph.js
          node tests/tensor_graph_check.js
          node - <<'JS'
          const fs=require('node:fs'),vm=require('node:vm');
          const html=fs.readFileSync('index.html','utf8');
          const scripts=[...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/g)];
          for(const match of scripts){if(match[1].trim())new vm.Script(match[1]);}
          console.log('Inline HTML scripts compile:',scripts.length);
          JS
          python - <<'PY'
          import re
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          assert '<button class="seg-btn" data-level="tensor">张量</button>' in s
          assert 'tensor_subgraph.js' in s
          assert "SeetheTruthTensor.build" in s
          assert "SeetheTruthTensor.detail" in s
          print('UI integration anchors pass')
          PY

  runtime-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU PyTorch for integration test
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Runtime forward backward optimizer tests
        run: |
          set -o pipefail
          python -m unittest discover -s tests -p 'test_runtime_trace.py' -v 2>&1 | tee runtime_ci_diagnostic.txt
      - name: Temporarily report synthetic-test traceback on PR
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          { echo 'Temporary CI diagnostic (synthetic test only):'; echo '```'; tail -c 5000 runtime_ci_diagnostic.txt; echo '```'; } > /tmp/trace_comment.txt
          gh pr comment "$PR_NUMBER" --body-file /tmp/trace_comment.txt
      - name: Smoke demo and validate graph schema
        run: |
          python examples/runtime_trace_demo.py
          python - <<'PY'
          import json
          from pathlib import Path
          g=json.loads(Path('examples/runtime_trace_demo.json').read_text())
          assert g['schema']=='model-atlas-graph-v1'
          assert g['meta']['runtime_validated']
          assert any(n['phase']=='backward' for n in g['nodes'])
          assert any(n.get('updated_count',0)>0 for n in g['nodes'])
          assert len(g['nodes'])<=900 and len(g['edges'])<=3500
          print('Runtime graph frontend contract PASS',len(g['nodes']),len(g['edges']))
          PY
