name: Static Analysis CI
on:
  push:
  pull_request:
jobs:
  evidence-contract:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Python syntax and tests
        run: |
          python -m py_compile atlas_parser.py atlas_server.py runtime_trace.py source_runtime_join.py telemetry_capture.py same_pass_evidence.py examples/runtime_trace_demo.py examples/telemetry_demo.py
          python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Tensor graph JavaScript syntax
        run: |
          node --check tensor_subgraph.js
          node --check tensor_ir.js
          node tests/semantic_tensor_ir_contracts.js
          node tests/semantic_state_contracts.js
          node tests/stream_graph_blocks_contracts.js
          node --check kv_cache_lab.js
          node tests/kv_cache_contracts.js
          node --check block_catalog.js
          node tests/block_catalog_contracts.js
          node tests/block_capability_contracts.js
          node --check block_knowledge.js
          node tests/block_knowledge_contracts.js
          node --check composite_atlas.js
          node tests/composite_atlas_contracts.js
          node --check training_flow.js
          node tests/training_flow_contracts.js
          node --check concept_flow.js
          node tests/concept_flow_contracts.js
          node --check learning_lab.js
          node tests/unified_graph_dependency_contracts.js
          node tests/operator_contracts.js
          node --check portable_operator_rules.js
          node tests/portable_operator_rules_contracts.js
          node --check normalization_rules.js
          node tests/normalization_rules_contracts.js
          node --check shape_index_rules.js
          node tests/shape_index_rules_contracts.js
          node --check element_lineage.js
          node tests/element_lineage_contracts.js
          node tests/shared_lowering_plan_contracts.js
          node tests/execution_ir_contracts.js
          node tests/graph_session_contracts.js
          node tests/unified_pack_registry_contracts.js
          node tests/graph_learning_path_contracts.js
          node tests/unified_learning_core_contracts.js
          node tests/unified_specialist_contracts.js
          node tests/unified_evidence_contracts.js
          node tests/engineering_journey_contracts.js
          node tests/engineering_pipeline_contracts.js
          node tests/universal_microscope_contracts.js
          node tests/microscope_named_axes_pointwise_contracts.js
          node tests/wan_ffn_microscope_contracts.js
          node tests/native_rowwise_microscope_contracts.js
          node tests/native_portable_coordinate_proofs.js
          node tests/studio_graph_session_contracts.js
          node tests/training_session_contracts.js
          node tests/gradient_inspection_contracts.js
          node tests/studio_node_timeline_contracts.js
          node tests/node_timeline_contracts.js
          node tests/learning_lab_contracts.js
          node tests/learning_lab_syntax_check.js
          node --check source_evidence_levels.js
          node tests/source_evidence_contracts.js
          node --check consensus_knowledge.js
          node tests/consensus_contracts.js
          node tests/consensus_math_oracles.js
          node --check tests/telemetry_syntax_check.js
          node tests/telemetry_syntax_check.js
          node tests/tensor_graph_check.js
          node tests/tensor_static_contracts.js
          node - <<'JS'
          const fs=require('node:fs'),vm=require('node:vm');
          const html=fs.readFileSync('index.html','utf8');
          const scripts=[...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/g)];
          for(const match of scripts){if(match[1].trim())new vm.Script(match[1]);}
          console.log('Inline HTML scripts compile:',scripts.length);
          JS
          python - <<'PY'
          import re
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          assert '<button class="seg-btn" data-level="tensor">张量</button>' in s
          assert 'tensor_subgraph.js' in s
          assert "SeetheTruthTensor.build" in s
          assert "SeetheTruthTensor.detail" in s
          print('UI integration anchors pass')
          PY

  runtime-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU PyTorch for integration test
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Runtime forward backward optimizer tests
        run: |
          set -o pipefail
          python -m unittest discover -s tests -p 'test_runtime_trace.py' -v 2>&1 | tee runtime_ci_diagnostic.txt
          python -m unittest discover -s tests -p 'test_telemetry.py' -v
          python -m unittest discover -s tests -p 'test_telemetry_oracles.py' -v
          python -m unittest discover -s tests -p 'test_same_pass_evidence.py' -v
      - name: Smoke demo and validate graph schema
        run: |
          python examples/runtime_trace_demo.py
          python examples/same_pass_demo.py
          python - <<'PY'
          import json
          from pathlib import Path
          g=json.loads(Path('examples/runtime_trace_demo.json').read_text())
          assert g['schema']=='model-atlas-graph-v1'
          assert g['meta']['runtime_validated']
          assert any(n['phase']=='backward' for n in g['nodes'])
          assert any(n.get('updated_count',0)>0 for n in g['nodes'])
          assert len(g['nodes'])<=900 and len(g['edges'])<=3500
          print('Runtime graph frontend contract PASS',len(g['nodes']),len(g['edges']))
          PY
