name: Real CPU PyTorch Training Codegen
on:
  pull_request:
    paths:
      - 'torch_codegen.js'
      - 'learning_lab.js'
      - 'block_catalog.js'
      - 'nd_tensor.js'
      - 'train_state.js'
      - 'graph_autodiff.js'
      - 'learn.html'
      - 'atlas_server.py'
      - 'tests/torch_codegen_contracts.js'
      - '.github/workflows/torch-export.yml'
  push:
    branches: [main]
    paths:
      - 'torch_codegen.js'
      - 'tests/torch_codegen_contracts.js'
      - '.github/workflows/torch-export.yml'
jobs:
  torch-cpu-executable:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check 'torch==2.6.0+cpu' --index-url https://download.pytorch.org/whl/cpu
      - run: node --check torch_codegen.js
      - run: node tests/torch_codegen_contracts.js
