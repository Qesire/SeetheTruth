name: Training Microflows Contracts
on:
  pull_request:
    paths:
      - 'micro_training_flows.js'
      - 'paper_patches.js'
      - 'paper_lab.html'
      - 'paper_hover.js'
      - 'block_catalog.js'
      - 'nd_tensor.js'
      - 'nd_autodiff.js'
      - 'nd_adamw_micro.js'
      - 'tests/nd_train_state_contracts.js'
      - 'tests/nd_gqa_autodiff_contracts.js'
      - 'tests/nd_vjp_local_contracts.js'
      - 'tests/nd_cached_decode_contracts.js'
      - 'activation_math.js'
      - 'optimizer_rules.js'
      - 'tests/activation_optimizer_contracts.js'
      - 'tests/optimizer_activation_expansion.js'
      - 'tests/nd_tensor_contracts.js'
      - 'block_knowledge.js'
      - 'concept_flow.js'
      - 'learning_lab.js'
      - 'learn.html'
      - 'graph_layout.js'
      - 'tests/graph_layout_contracts.js'
      - 'tests/model_gate_composition.js'
      - 'tests/expert_ffn_composition.js'
      - 'expert_ffn_vjp.js'
      - 'tests/expert_ffn_vjp.js'
      - 'tests/mla_cache_composition.js'
      - 'tests/grpo_objective_contracts.js'
      - 'grpo_backward.js'
      - 'graph_autodiff.js'
      - 'tests/graph_autodiff_contracts.js'
      - 'tests/moe_graph_autodiff_contracts.js'
      - 'train_state.js'
      - 'tests/train_state_contracts.js'
      - 'tests/trainable_architecture_contracts.js'
      - 'graph_readiness.js'
      - 'tests/graph_readiness_contracts.js'
      - 'branch_execution.js'
      - 'tests/branch_execution_contracts.js'
      - 'adamw_micro.js'
      - 'tests/adamw_micro_contracts.js'
      - 'tests/grpo_backward_contracts.js'
      - 'tests/mla_two_decode_steps.js'
      - 'tests/paper_linked_blocks.js'
      - 'tests/advanced_primitives.js'
      - 'tests/model_family_primitives.js'
      - 'tests/paper_hover_contracts.js'
      - 'tests/paper_patches_contracts.js'
      - 'tests/micro_training_flows_contracts.js'
      - '.github/workflows/training-microflows.yml'
  push:
    branches: [main]
    paths:
      - 'micro_training_flows.js'
      - 'block_catalog.js'
      - 'block_knowledge.js'
      - 'concept_flow.js'
      - 'tests/**'
      - '.github/workflows/training-microflows.yml'
jobs:
  numerical-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check block_catalog.js && node --check block_knowledge.js && node --check concept_flow.js
      - run: node --check micro_training_flows.js && node --check paper_patches.js && node --check paper_hover.js
      - run: node tests/block_catalog_contracts.js
      - run: node tests/concept_flow_contracts.js
      - run: node --check nd_tensor.js && node tests/nd_tensor_contracts.js
      - run: node --check nd_autodiff.js && node tests/nd_gqa_autodiff_contracts.js
      - run: node --check nd_adamw_micro.js && node tests/nd_train_state_contracts.js
      - run: node tests/nd_vjp_local_contracts.js
      - run: node tests/nd_cached_decode_contracts.js
      - run: node --check activation_math.js && node --check optimizer_rules.js && node tests/activation_optimizer_contracts.js
      - run: node tests/optimizer_activation_expansion.js
      - run: node tests/micro_training_flows_contracts.js
      - run: node tests/paper_patches_contracts.js
      - run: node tests/paper_hover_contracts.js
      - run: node tests/paper_linked_blocks.js
      - run: node tests/advanced_primitives.js
      - run: node tests/model_family_primitives.js
      - run: node --check graph_layout.js && node tests/graph_layout_contracts.js
      - run: node tests/model_gate_composition.js
      - run: node tests/expert_ffn_composition.js
      - run: node --check expert_ffn_vjp.js && node tests/expert_ffn_vjp.js
      - run: node tests/mla_cache_composition.js
      - run: node tests/grpo_objective_contracts.js
      - run: node --check grpo_backward.js && node tests/grpo_backward_contracts.js
      - run: node --check graph_autodiff.js && node tests/graph_autodiff_contracts.js
      - run: node tests/moe_graph_autodiff_contracts.js
      - run: node --check train_state.js && node tests/train_state_contracts.js
      - run: node tests/trainable_architecture_contracts.js
      - run: node --check graph_readiness.js && node tests/graph_readiness_contracts.js
      - run: node --check branch_execution.js && node tests/branch_execution_contracts.js
      - run: node --check adamw_micro.js && node tests/adamw_micro_contracts.js
      - run: node tests/mla_two_decode_steps.js
