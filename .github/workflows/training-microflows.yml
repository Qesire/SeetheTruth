  push:
    branches: [main]
    paths:
      - 'micro_training_flows.js'
      - 'block_catalog.js'
      - 'block_knowledge.js'
      - 'concept_flow.js'
      - 'tests/**'
      - '.github/workflows/training-microflows.yml'
jobs:
  numerical-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check block_catalog.js && node --check block_knowledge.js && node --check concept_flow.js
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check 'numpy>=1.26,<3'
      - run: node --check python_codegen.js && node --check torch_codegen.js && node tests/python_codegen_contracts.js && node tests/python_codegen_extensions_contracts.js
      - run: node tests/write_python_export_examples.js
      - uses: actions/upload-artifact@v4
        with:
          name: executable-numpy-graph-examples
          path: artifacts/executable-python
          retention-days: 14
      - run: node --check micro_training_flows.js && node --check paper_patches.js && node --check paper_hover.js
      - run: node tests/release_surface_contracts.js
      - run: node --check graph_cost_report.js && node tests/graph_cost_report_contracts.js
      - run: node tests/graph_cost_evidence_extensions.js
      - run: node --check architecture_tradeoffs.js && node tests/architecture_tradeoffs_contracts.js
      - run: node tests/block_catalog_contracts.js
      - run: node --check multimodal_ops.js && node tests/multimodal_contracts.js
      - run: node --check multimodal_advanced.js && node tests/multimodal_advanced_contracts.js
      - run: node --check video_causal_conv3d.js && node tests/video_causal_conv3d_contracts.js
      - run: node --check inference_ops.js && node tests/inference_ops_contracts.js
      - run: node --check deepinfer_runtime_ops.js && node tests/deepinfer_runtime_contracts.js
      - run: node --check deepinfer_worker_events.js && node --check deepinfer_worker_lab.js && node tests/deepinfer_worker_events_contracts.js
      - run: node --check deepinfer_zos_metadata.js && node tests/deepinfer_zos_metadata_contracts.js
      - run: node --check deepinfer_decode_metadata.js && node tests/deepinfer_decode_metadata_contracts.js
      - run: node --check deepinfer_kv_lifecycle.js && node --check deepinfer_kv_lifecycle_lab.js && node tests/deepinfer_kv_lifecycle_contracts.js
      - run: node --check deepinfer_scheduler_workflow.js && node --check deepinfer_scheduler_lab.js && node tests/deepinfer_scheduler_workflow_contracts.js
      - run: node --check deepinfer_prefill_policy.js && node --check deepinfer_prefill_lab.js && node tests/deepinfer_prefill_policy_contracts.js
      - run: node --check android_teaching_mode.js && node tests/android_teaching_contracts.js
      - run: node tests/concept_flow_contracts.js
      - run: node --check nd_tensor.js && node tests/nd_tensor_contracts.js
      - run: node --check nd_autodiff.js && node tests/nd_gqa_autodiff_contracts.js
      - run: node --check nd_adamw_micro.js && node tests/nd_train_state_contracts.js
      - run: node tests/nd_vjp_local_contracts.js
      - run: node tests/nd_cached_decode_contracts.js
      - run: node --check activation_math.js && node --check optimizer_rules.js && node tests/activation_optimizer_contracts.js
      - run: node tests/optimizer_activation_expansion.js
      - run: node tests/micro_training_flows_contracts.js
      - run: node --check paper_graph_rewrites.js && node tests/paper_graph_rewrites_contracts.js
      - run: node --check model_trace_bridge.js && node tests/model_trace_bridge_contracts.js
      - run: node --check industrial_source_inspector.js && node tests/industrial_source_contracts.js
      - run: node tests/model_trace_contracts.js
      - run: node tests/paper_patches_contracts.js
      - run: node tests/paper_hover_contracts.js
      - run: node tests/paper_linked_blocks.js
      - run: node tests/advanced_primitives.js
      - run: node tests/model_family_primitives.js
      - run: node --check graph_layout.js && node tests/graph_layout_contracts.js
      - run: node tests/model_gate_composition.js
      - run: node tests/expert_ffn_composition.js
      - run: node --check expert_ffn_vjp.js && node tests/expert_ffn_vjp.js
      - run: node tests/mla_cache_composition.js
      - run: node tests/grpo_objective_contracts.js
      - run: node --check grpo_backward.js && node tests/grpo_backward_contracts.js
      - run: node --check graph_autodiff.js && node tests/graph_autodiff_contracts.js
      - run: node tests/moe_graph_autodiff_contracts.js
      - run: node --check loop_input_injection.js && node --check adaptive_token_depth.js && node --check loop_transformer.js && node --check loop_consistency.js && node --check loop_design_tradeoffs.js && node --check architecture_why.js && node tests/architecture_why_contracts.js && node --check training_objective.js
      - run: node --check train_state.js && node tests/train_state_contracts.js
      - run: node tests/trainable_architecture_contracts.js
      - run: node --check graph_readiness.js && node tests/graph_readiness_contracts.js
      - run: node --check branch_execution.js && node tests/branch_execution_contracts.js
      - run: node --check adamw_micro.js && node tests/adamw_micro_contracts.js
      - run: node tests/mla_two_decode_steps.js
