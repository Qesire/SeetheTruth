name: Static Behavior Acceptance
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  simulation-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Deterministic source and graph contracts
        run: python -m unittest discover -s tests -p 'test_static_contracts.py' -v
      - name: Install headless Chromium
        run: |
          python -m pip install 'playwright==1.55.0'
          python -m playwright install --with-deps chromium
      - name: Real-browser UI behavior and adversarial imports
        run: python tests/browser_acceptance.py
      - name: Screenshot-backed KV Cache visual acceptance
        run: python tests/browser_cache_screenshots.py
      - name: Real model provenance import and no-false-evidence Chromium acceptance
        run: python tests/browser_real_model_lab.py
      - name: Archive evidence-only trace inspector screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seethetruth-model-trace-browser-structural-only
          path: |
            real_model_screenshots/*.png
            real_model_screenshots/manifest.json
          if-no-files-found: warn
          retention-days: 14
      - name: Screenshot-backed 45-block library and numerical lesson acceptance
        run: python tests/browser_catalog_screenshots.py
      - name: Archive visible 45-block catalogue screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seethetruth-45-block-library-real-chromium
          path: |
            catalog_screenshots/*.png
            catalog_screenshots/manifest.json
          if-no-files-found: warn
          retention-days: 14
      - name: Validate real image/audio/video composition and exports in Chromium
        run: python tests/browser_multimodal.py
      - name: Archive multimodal visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seethetruth-multimodal-image-audio-video-real-chromium
          path: multimodal_screenshots/*.png
          if-no-files-found: warn
          retention-days: 14
      - name: Verify public-source block deep dives in real Chromium
        run: python tests/browser_block_knowledge.py
      - name: Archive rendered knowledge inspector and citation screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seethetruth-real-browser-block-knowledge
          path: |
            knowledge_screenshots/*.png
            knowledge_screenshots/manifest.json
          if-no-files-found: warn
          retention-days: 14
      - name: Real Chromium hierarchical model drilldown and shape acceptance
        run: python tests/browser_composite_hierarchy.py
      - name: Archive verified decoder to mathematical leaf screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seethetruth-composite-hierarchy-real-chromium
          path: |
            composite_screenshots/*.png
            composite_screenshots/manifest.json
          if-no-files-found: warn
          retention-days: 14
      - name: Real Chromium symbolic-to-optimizer training state acceptance
        run: python tests/browser_training_screenshots.py
      - name: Archive real training-state browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seethetruth-training-gradient-adamw-chromium
          path: |
            training_screenshots/*.png
            training_screenshots/manifest.json
          if-no-files-found: warn
          retention-days: 14
      - name: Preserve rendered Chromium screenshots and visual checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seethetruth-kv-real-chromium-screenshots
          path: |
            screenshots/*.png
            screenshots/manifest.json
          if-no-files-found: warn
          retention-days: 14
