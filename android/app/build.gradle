plugins { id 'com.android.application' }

android {
    namespace 'io.github.qesire.seethetruth'
    compileSdk 35
    defaultConfig {
        applicationId 'io.github.qesire.seethetruth.teaching'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0-teaching'
    }
    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    sourceSets {
        main.assets.srcDir(layout.buildDirectory.dir('generated/teaching-assets'))
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.13.0'
}

// An explicit, reviewed list stops new desktop resources silently entering the APK.
def teachingFiles = file('teaching-assets.txt').readLines()
    .collect { it.trim() }.findAll { it && !it.startsWith('#') }
def stageTeachingAssets = tasks.register('stageTeachingAssets', Sync) {
    from(rootProject.projectDir.parentFile) {
        teachingFiles.each { include it }
    }
    into(layout.buildDirectory.dir('generated/teaching-assets'))
}
tasks.named('preBuild').configure { dependsOn(stageTeachingAssets) }
