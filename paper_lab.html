<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SeetheTruth · Paper Patch Lab</title><link rel="stylesheet" href="compute_microscope.css"><style>
:root{color-scheme:dark;font-family:Inter,"Microsoft YaHei",sans-serif;background:#07121d;color:#e5f5ff}*{box-sizing:border-box}body{margin:0}header{padding:24px 4vw;background:linear-gradient(110deg,#103d4e,#10192c);border-bottom:1px solid #30637b}h1{margin:5px 0;font-size:24px}p{color:#a4bfd2;line-height:1.6}main{padding:20px 4vw;max-width:1500px;margin:auto}.layout{display:grid;grid-template-columns:270px minmax(0,1fr);gap:18px}.panel{background:#102436;border:1px solid #31536b;border-radius:12px;padding:18px;margin-bottom:16px}button{background:#14384a;border:1px solid #37718a;border-radius:8px;color:#e0f6ff;padding:12px;cursor:pointer;text-align:left}button.active{background:#176375;border-color:#6ae7d1}#choices{display:grid;gap:8px}.pair{display:grid;grid-template-columns:1fr 1fr;gap:14px}.chain{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:14px 0}.node{border:1px solid #337c8d;background:#0a2e3e;border-radius:9px;padding:13px 15px;font:12px monospace}.arrow{color:#84e6d4}a{color:#93e9e7}h2{margin:0 0 12px;font-size:17px}h3{font-size:14px;color:#8febd6}pre{white-space:pre-wrap;word-break:break-word;font:12px/1.6 ui-monospace,monospace;background:#081825;border:1px solid #294e62;border-radius:8px;padding:12px;max-height:380px;overflow:auto}.stats{display:flex;flex-wrap:wrap;gap:9px}.chip{border:1px solid #396c7e;border-radius:8px;padding:8px 12px}.chip strong{display:block;font:16px monospace;color:#9aefdf}.note{font-size:12px;color:#adcad9}label{font-size:12px;display:block;margin:8px 0 4px}input{width:100%;padding:9px;background:#091c2a;border:1px solid #37617a;border-radius:7px;color:white}@media(max-width:900px){.layout,.pair{grid-template-columns:1fr}}</style></head>
<body><header><small>SEETHETRUTH / PAPER-DRIVEN OPERATOR REWRITES</small><h1>论文变换实验台</h1><p>从原计算图到论文修改后的计算图。观察变换范围、参数语义、数值与统计差异；符号机制和真正数值实现明确区分。</p><a href="learn.html">← 返回主积木台</a></header><main><div class="layout"><nav class="panel"><h2>论文方法</h2><div id="choices"></div></nav><div><section class="panel"><h2 id="title"></h2><p id="description"></p><div id="source"></div><div class="pair"><div><h3>Baseline</h3><div class="chain" id="before"></div></div><div><h3>Paper patch</h3><div class="chain" id="after"></div></div></div><p class="note" id="scope"></p><div id="controls"></div><button id="calculate">执行微型数值对照</button></section><section class="panel"><h2>论文方法内部运算 · 通用计算显微镜</h2><p class="note">展开真正运行的每个矩阵乘、缩放和中间状态。Online Softmax 可以逐 Tile 查看 running max、分母更新和加权累积；LoRA / DoRA 可以逐权重坐标复核。</p><div id="computeMicroscope" class="cmp-surface"></div></section><div class="pair"><section class="panel"><h2>变换规则 / 不变量</h2><pre id="contract"></pre></section><section class="panel"><h2>数值证据</h2><div class="stats" id="metrics"></div><pre id="numeric"></pre></section></div></div></div></main>
<script src="paper_patches.js"></script><script src="compute_microscope.js"></script><script src="compute_microscope_ui.js"></script><script src="paper_compute_trace.js"></script><script>
(()=>{"use strict";const P=window.SeetheTruthPaperPatches,Trace=window.SeetheTruthPaperMicroscope,$=s=>document.querySelector(s),microscope=window.SeetheTruthMicroscopeUI.mount($('#computeMicroscope')),schemas={
lora_linear:{before:["X","MatMul W0","Y"],after:["X","Frozen W0 + (α/r)AB","Y"],controls:[["alpha","LoRA α",2]]},
dora_linear:{before:["X","MatMul W","Y"],after:["X","W0+AB","Direction normalize","Scale magnitude m","Y"],controls:[["m","Magnitude m (both outputs)",2]]},
online_attention:{before:["QKᵀ/√d","Softmax","PV"],after:["Q/K tiles","Online max & sum","Weighted V accumulation","O"],controls:[["chunk","Key tile length",1]]},
switch_top1:{before:["X","Dense FFN","Y"],after:["Router","Top-1 dispatch","Expert FFN","Gather"],controls:[]},
activation_checkpoint:{before:["Forward","Save activations","Backward"],after:["Forward","Save boundary","Recompute on backward","VJP"],controls:[]}
};let active=P.variants[0];const fmt=x=>JSON.stringify(x,null,2);
function chain(el,items){el.replaceChildren();items.forEach((s,i)=>{if(i){const a=document.createElement("span");a.className="arrow";a.textContent="→";el.append(a);}const n=document.createElement("span");n.className="node";n.textContent=s;el.append(n);});}
function show(){const patch=P.papers[active.source],s=schemas[active.id];$("#title").textContent=patch.title+" · "+active.type;$("#description").textContent=patch.effect;$("#source").replaceChildren();const a=document.createElement("a");a.href=patch.url;a.textContent="论文原文 ↗";a.target="_blank";a.rel="noopener noreferrer";$("#source").append(a);
chain($("#before"),s.before);chain($("#after"),s.after);$("#scope").textContent="作用域："+active.scope+" · 输入："+active.inputs.join(", ")+" · 状态："+active.state.join(", ");
$("#contract").textContent=fmt({formula:active.formula,changes:active.changes,preserves:active.preserves,verify:active.verify,status:active.id==="switch_top1"||active.id==="activation_checkpoint"?"symbolic_contract_only":"bounded_numerical_forward"});
$("#controls").replaceChildren();for(const [id,name,defaultValue] of s.controls){const label=document.createElement("label");label.textContent=name;const input=document.createElement("input");input.id="param_"+id;input.type="number";input.step="any";input.value=defaultValue;$("#controls").append(label,input);}
document.querySelectorAll("[data-patch]").forEach(b=>b.classList.toggle("active",b.dataset.patch===active.id));calculate();}
function calculate(){try{const read=id=>{const el=$("#param_"+id);const v=Number(el.value);if(el.value.trim()===""||!Number.isFinite(v))throw Error("invalid numeric input");return v;};let result,frame=null;
if(active.id==="lora_linear"){
 const args={x:[[1,2]],w:[[1,0],[0,1]],a:[[1],[2]],b:[[3,4]],alpha:read("alpha")};
 result=P.lora(args.x,args.w,args.a,args.b,args.alpha);frame=Trace.lora(args,result);
}
else if(active.id==="dora_linear"){
 const args={x:[[1,2]],w:[[1,0],[0,1]],a:[[1],[2]],b:[[3,4]],m:[[read("m"),read("m")]]};
 result=P.dora(args.x,args.w,args.a,args.b,args.m);frame=Trace.dora(args,result);
}
else if(active.id==="online_attention"){
 const args={q:[[1,0],[0,1]],k:[[1,0],[0,1]],v:[[3,4],[5,6]],chunk:read("chunk")};
 result=P.onlineAttention(args.q,args.k,args.v,args.chunk);frame=Trace.online(args,result);
}
else {microscope.clear('当前方法有明确的结构改写步骤，下一步将连接对应可运行算子后继续向内展开。');$("#metrics").replaceChildren();$("#numeric").textContent="此变换当前提供结构合同，数值操作正在通过现有微训练引擎接入。";return;}
microscope.show(frame);
$("#metrics").replaceChildren();for(const [key,val] of Object.entries(result.statistics||{})){const card=document.createElement("div");card.className="chip";const title=document.createElement("span");title.textContent=key+" RMS";const value=document.createElement("strong");value.textContent=Number(val.rms.toPrecision(5));card.append(title,value);$("#metrics").append(card);}$("#numeric").textContent=fmt(result);}
catch(e){microscope.clear('本次计算输入无效：'+e.message);$("#metrics").replaceChildren();$("#numeric").textContent="输入或计算错误："+e.message;}}
P.variants.forEach(v=>{const b=document.createElement("button");b.dataset.patch=v.id;b.textContent=P.papers[v.source].title+" · "+v.scope;b.onclick=()=>{active=v;show();};$("#choices").append(b);});$("#calculate").onclick=calculate;show();
})();
</script></body></html>
