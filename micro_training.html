<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SeetheTruth · Training Microflows</title>
<style>:root{color-scheme:dark;font-family:system-ui,"Microsoft Yahei",sans-serif;background:#08111d;color:#e2f5ff}*{box-sizing:border-box}body{margin:0}header{padding:25px 4vw;border-bottom:1px solid #285069;background:linear-gradient(120deg,#0c3040,#0a1425)}h1{margin:0;font-size:23px}p{color:#acc7d9;line-height:1.65}main{padding:24px 4vw;max-width:1350px;margin:auto}.tabs{display:flex;gap:10px;flex-wrap:wrap}.tabs button,button{cursor:pointer;background:#122c42;color:#d9f7ff;border:1px solid #34718b;border-radius:8px;padding:10px 16px}.tabs button.active{background:#166478;border-color:#81eadb}.grid{display:grid;grid-template-columns:minmax(260px,370px) 1fr;gap:18px;margin-top:19px}.panel{border:1px solid #2a5168;background:#102233;border-radius:13px;padding:20px;min-width:0}label{display:block;font-size:12px;color:#aacbdf;margin:16px 0 5px}input{width:100%;background:#091724;color:#fff;border:1px solid #39708a;border-radius:6px;padding:9px}h2{font-size:17px;margin:0 0 12px}h3{font-size:14px;color:#86eadc}pre{white-space:pre-wrap;word-break:break-word;background:#081723;border:1px solid #27495e;border-radius:8px;padding:14px;font:12px/1.65 ui-monospace,Consolas,monospace;max-height:560px;overflow:auto}.tag{color:#8ee2ec;font:11px monospace}.muted{font-size:12px;color:#9cb9c9}.metric{display:inline-block;border:1px solid #325d72;border-radius:8px;padding:9px 12px;margin:5px 7px 5px 0;background:#102f42}.metric b{display:block;font:17px monospace;color:#aff5dc}a{color:#8edbe9}@media(max-width:850px){.grid{grid-template-columns:1fr}}</style></head><body>
<header><div class="tag">SEETHETRUTH / MICRO TRAINING FLOW / CPU-ONLY</div><h1>从张量值到梯度汇合 · MoE · PPO</h1><p>真实的有界 Float64 教学运算。矩阵、梯度及其统计量都来自计算，不是 GPU 性能测量或真实模型追踪。</p><a href="learn.html">返回 Scratch 学习台</a></header>
<main><div class="tabs"><button data-case="shared" class="active">共享参数 · 反向传播</button><button data-case="moe">MoE · 专家路由</button><button data-case="ppo">RL · PPO Clipping</button></div>
<div class="grid"><section class="panel"><h2 id="scenario"></h2><p id="explanation"></p><div id="controls"></div><button id="run">执行数值计算</button><p class="muted">每次修改参数都可重新计算，直接检查梯度、路由和统计量。所有示例均不依赖 GPU。</p></section><section class="panel"><h2>计算流证据</h2><div id="metrics"></div><h3>逐项数值与机制</h3><pre id="details"></pre></section></div></main>
<script src="micro_training_flows.js"></script><script>
const T=window.SeetheTruthMicroTrain,$=s=>document.querySelector(s);
const cases={
shared:{name:"同一 W 被两条路径复用",help:"xW + xW → MSE → 两条 VJP 汇聚到唯一参数 W；再次 backward 会继续累积，zero_grad 后恢复 None。",fields:[["x1","第一维输入",1],["x2","第二维输入",2],["w1","W 第一维",2],["w2","W 第二维",3],["target","目标",0]]},
moe:{name:"Top-1 MoE 的稀疏路由和专家梯度",help:"逐 token Softmax → argmax 选择专家 → 专家线性计算 → MSE 反向；只有被选专家收到任务梯度，离散 router 路径在本演示中不反传。",fields:[["r","首 token 对专家 0 的 logit",5],["capacity","每专家容量 (1 或 2)",2]]},
ppo:{name:"PPO clipped surrogate 的真实局部导数",help:"固定旧策略和优势估计，计算新旧策略的 action 概率比、裁剪目标及对新策略 logits 的梯度；不包含 rollout、value head、GRPO 或策略采样。",fields:[["logit","新策略 action 0 的 logit",0],["adv","优势 A",1],["eps","裁剪幅度",.2]]}
};
let active="shared";
function show(){const c=cases[active];$("#scenario").textContent=c.name;$("#explanation").textContent=c.help;$("#controls").replaceChildren();for(const [id,name,value] of c.fields){const label=document.createElement("label");label.textContent=name;const inp=document.createElement("input");inp.type="number";inp.step="any";inp.id="val_"+id;inp.value=value;$("#controls").append(label,inp);}document.querySelectorAll("[data-case]").forEach(b=>b.classList.toggle("active",b.dataset.case===active));render();}
function render(){try{const v=k=>{const n=Number($("#val_"+k).value);if(!Number.isFinite(n)||$("#val_"+k).value.trim()==="")throw Error("参数必须是有限实数");return n;};let result,summary={},lines=[];
if(active==="shared"){const t=new T.Tape(),x=t.input([[v("x1"),v("x2")]],"x"),w=t.parameter("W",[[v("w1")],[v("w2")]]),a=t.matmul(x,w),b=t.matmul(x,t.parameter("W",[[v("w1")],[v("w2")]])),sum=t.add(a,b),loss=t.meanSquare(sum,[[v("target")]]);t.backward(loss);result={prediction:t.value(sum),loss:t.value(loss),gradients:t.gradients(),events:t.events};summary={loss:t.value(loss)[0][0],dW1:t.gradients().W[0][0],dW2:t.gradients().W[1][0],sharedParameters:t.parameters.size};lines=["前向：x → MatMul(W) 两次 → Add → MSE","反向：两个 MatMul 的 VJP 必须对同一 W 求和",JSON.stringify(result,null,2)];}
else if(active==="moe"){const capacity=v("capacity");if(!Number.isSafeInteger(capacity)||capacity<1||capacity>2)throw Error("容量仅限 1 或 2");result=T.moeBackward([[1,2],[2,1]],[[[1],[0]],[[0],[1]]],[[v("r"),0],[0,5]],[[0],[0]],{capacity});summary={loss:result.loss,expert0:result.counts[0],expert1:result.counts[1],overflow:result.routed.filter(x=>!x.accepted).length};lines=["前向：router logits → Softmax → Top-1 dispatch → expert matmul","反向：每个专家局部 W 只接收实际 routed token 的梯度","router 梯度 = null，不能误称为零梯度",JSON.stringify(result,null,2)];}
else{result=T.ppo([v("logit"),0],[0,0],0,v("adv"),v("eps"));summary={ratio:result.ratio,loss:result.loss,gradAction:result.gradLogits[0],clipped:!result.active};lines=["策略快照：old logits=[0,0]；action=0","L=-min(rA,clip(r,1-ε,1+ε)A)","仅在未裁剪分支保留 policy logits 梯度",JSON.stringify(result,null,2)];}
$("#metrics").replaceChildren();Object.entries(summary).forEach(([k,value])=>{const card=document.createElement("div");card.className="metric";const caption=document.createElement("span");caption.textContent=k;const num=document.createElement("b");num.textContent=typeof value==="number"?Number(value.toPrecision(6)).toString():String(value);card.append(caption,num);$("#metrics").append(card);});$("#details").textContent=lines.join("\n\n");}
catch(e){$("#metrics").replaceChildren();$("#details").textContent="计算失败："+e.message;}}
document.querySelectorAll("[data-case]").forEach(b=>b.addEventListener("click",()=>{active=b.dataset.case;show();}));$("#run").addEventListener("click",render);show();
</script><script src="learning_experience_core.js"></script><script src="specialized_learning_adapter.js" data-experience="micro_training"></script></body></html>
